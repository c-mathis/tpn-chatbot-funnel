name = "tax-peace-conversions"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

# D1 Database binding for CRM
[[d1_databases]]
binding = "DB"
database_name = "tpn_crm"
database_id = "f473c127-665e-435e-866b-56c78c368fea"

# KV namespace binding for session storage
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "b34e0863466046d2ad779c2a566ce469"

# Environment variables (set these in Cloudflare dashboard or via CLI)
# wrangler secret put META_ACCESS_TOKEN
# wrangler secret put META_PIXEL_ID
# wrangler secret put GOOGLE_SHEETS_URL (optional)
# wrangler secret put GA4_API_SECRET
# wrangler secret put RESEND_API_KEY
# wrangler secret put NOTIFY_EMAILS  (comma-separated, e.g. "cam@example.com,partner@firm.com")

[env.production]
name = "tax-peace-conversions"

[env.staging]
name = "tax-peace-conversions-staging"